services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventful
      POSTGRES_PASSWORD: eventful
      POSTGRES_DB: eventful
    ports:
      - "5432:5432"
    volumes:
      - eventful_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventful"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventful_postgres_data:
